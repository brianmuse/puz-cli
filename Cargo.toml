# One workspace, three packages:
#   crates/puz-core  the puzzle file model and everything that edits one file (library)
#   crates/puz       the `puz` command (package puz-cli): works on one puzzle file
#   crates/swords    the Swords client (package swords-client): publish to a Swords solving site (library)
[workspace]
resolver = "3"
members = ["crates/puz-core", "crates/puz", "crates/swords"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brianmuse/puz-cli"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
resvg = "0.45"
svg2pdf = "0.13.0"
